services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync
      POSTGRES_DB: fieldsync
    ports:
      - '5432:5432'
    volumes:
      - fieldsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fieldsync']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fieldsync:fieldsync@postgres:5432/fieldsync?schema=public
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost:3001
    ports:
      - '3000:3000'
    command: sh -c "npx prisma migrate deploy && node dist/main"

volumes:
  fieldsync_postgres_data:
