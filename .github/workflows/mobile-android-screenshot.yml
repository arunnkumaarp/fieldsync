name: Mobile Android screenshot

# Manual trigger only — booting an emulator and building the Android app
# takes ~15-25 minutes, so this shouldn't run on every push. Trigger it from
# the Actions tab ("Run workflow") or via the API.
on:
  workflow_dispatch: {}

jobs:
  android-screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        working-directory: mobile
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*') }}

      # Release, not debug: a debug APK expects a Metro bundler running
      # alongside it. Release bundles the JS into the APK, so the emulator
      # doesn't need anything else running to render the real app. The repo's
      # default release build is signed with the committed debug keystore
      # (see android/app/build.gradle) specifically so this works without a
      # real signing setup — fine for this smoke test, not for a store build.
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install app, capture screenshot + logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.fieldsyncmobile -c android.intent.category.LAUNCHER 1 || true
            sleep 10
            adb exec-out screencap -p > mobile-screenshot.png || true
            adb logcat -d > mobile-logcat.txt || true

      - name: Upload screenshot + logcat
        uses: actions/upload-artifact@v4
        with:
          name: fieldsync-mobile-android
          path: |
            mobile-screenshot.png
            mobile-logcat.txt
          if-no-files-found: warn
